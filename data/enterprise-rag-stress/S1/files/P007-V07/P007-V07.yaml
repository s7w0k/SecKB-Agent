doc_id: P007-V07
product: P007
version: v3.5
family: config-sample
items:
- type: heading
  text: 产品定位与场景 - 1
- type: para
  text: 数据防泄漏（Data Loss Prevention，代号 COVDLP）隶属于数据防泄漏、隐私计算和数据治理场景，当前生命状态ACTIVE，当前版本线 v3.5。其 核心协议 的取值/配置为 DLP 正则库、敏感数据 OCR、水印追踪 ，约束条件包括支持 DLP 正则库、支持 敏感数据 OCR、支持 水印追踪。
- type: para
  text: 在企业版部署中，数据防泄漏 将 事件摄取吞吐 设计为 320000 events/s，并受到 enterprise-edition、3-node 的边界约束；相关细节记录的 fact_id 为 P007-F122，自 2025-06-01 起生效。
- type: para
  text: 数据防泄漏 面向 数据防泄漏、隐私计算和数据治理 的高隔离要求，其 API 峰值并发 被定为 9000 req/s；叠加 enterprise-edition 之后，可支撑 320000 events/s 的吞吐基线，覆盖 cn 区域。
- type: para
  text: 从运维视角看，数据防泄漏 在 v3.5-cn-finance 上的 P95 检索延迟 表现稳定为 30 ms，p95、warm；这一口径与相邻产品 P008 的 数据防泄漏、隐私计算和数据治理 联合方案保持一致。
- type: para
  text: 数据防泄漏 的产品资料强调 最大单文档上传；在默认配置下等于 64 MB，约束为 默认限制。当工作负载包含 脱敏、防泄漏、水印、敏感识别、DLP、外发审计、数据分类、边界 等能力维度时，上述约束保持不变。
- type: para
  text: Data Loss Prevention（COVDLP）的 日志/审计留存期 记为 180 days，限定条件 默认；该数值服务于 数据防泄漏、隐私计算和数据治理，由 v3.5-cn-finance 版本正式支持。
- type: para
  text: 关于 数据防泄漏 的 批量接口吞吐，文献给出的标准口径为 7800 ops/s，并附加 batch=512 说明；这是评估 数据防泄漏、隐私计算和数据治理 能力时的重要依据（P007-F127）。
- type: para
  text: 数据防泄漏 v3.5-cn-finance 的 当前版本线 配置为 v3.5 version；在 GA 场景下仍能维持 30 ms 的 P95 延迟，符合 cn 区域的运营要求。
- type: para
  text: 数据防泄漏（Data Loss Prevention，代号 COVDLP）隶属于数据防泄漏、隐私计算和数据治理场景，当前生命状态ACTIVE，当前版本线 v3.5。其 默认批次大小 的取值/配置为 512 items，约束条件包括可配置。
- type: para
  text: 在企业版部署中，数据防泄漏 将 不支持能力 设计为 不支持主库直接内联扫描 ，并受到 negation 的边界约束；相关细节记录的 fact_id 为 P007-F130，自 2025-01-01 起生效。
- type: para
  text: 数据防泄漏 面向 数据防泄漏、隐私计算和数据治理 的高隔离要求，其 否定事实 被定为 仅企业版支持跨边界脱敏 ；叠加 negation、must-not-claim 之后，可支撑 320000 events/s 的吞吐基线，覆盖 cn 区域。
- type: para
  text: 从运维视角看，数据防泄漏 在 v3.5-cn-finance 上的 否定事实 表现稳定为 不支持 S3 未挂载桶扫描 ，negation、must-not-claim；这一口径与相邻产品 P008 的 数据防泄漏、隐私计算和数据治理 联合方案保持一致。
- type: para
  text: 数据防泄漏 的产品资料强调 可用性目标；在默认配置下等于 99.9 percent，约束为 enterprise-SLA。当工作负载包含 脱敏、防泄漏、水印、敏感识别、DLP、外发审计、数据分类、边界 等能力维度时，上述约束保持不变。
- type: para
  text: Data Loss Prevention（COVDLP）的 合规基座 记为 GB-35273/CAC-审查-P007 ，限定条件 zh-cn；该数值服务于 数据防泄漏、隐私计算和数据治理，由 v3.5-cn-finance 版本正式支持。
- type: para
  text: 关于 数据防泄漏 的 企业版起价，文献给出的标准口径为 18590 cny/月，并附加 per-org、annual 说明；这是评估 数据防泄漏、隐私计算和数据治理 能力时的重要依据（P007-F135）。
- type: para
  text: 数据防泄漏 v3.5-cn-finance 的 主邻接产品 配置为 P008 product；在 邻接 P008 场景下仍能维持 30 ms 的 P95 延迟，符合 cn 区域的运营要求。
- type: para
  text: 数据防泄漏（Data Loss Prevention，代号 COVDLP）隶属于数据防泄漏、隐私计算和数据治理场景，当前生命状态ACTIVE，当前版本线 v3.5。其 旧版事件吞吐 的取值/配置为 198400 events/s，约束条件包括v3.4、legacy。
- type: para
  text: 在企业版部署中，数据防泄漏 将 旧版 P95 延迟 设计为 51 ms，并受到 v3.4、legacy 的边界约束；相关细节记录的 fact_id 为 P007-F138，自 2024-06-01 起生效。
- type: para
  text: 数据防泄漏 面向 数据防泄漏、隐私计算和数据治理 的高隔离要求，其 与 P008 兼容 被定为 true bool；叠加 edge P007->P008 之后，可支撑 320000 events/s 的吞吐基线，覆盖 cn 区域。
- type: para
  text: 从运维视角看，数据防泄漏 在 v3.5-cn-finance 上的 与 P015 兼容 表现稳定为 true bool，edge P007->P015；这一口径与相邻产品 P008 的 数据防泄漏、隐私计算和数据治理 联合方案保持一致。
