  text: 在企业版部署中，数据防泄漏 将 主邻接产品 设计为 P008 product，并受到 邻接 P008 的边界约束；相关细节记录的 fact_id 为 P007-F136，自 2025-02-01 起生效。
- type: para
  text: 数据防泄漏 面向 数据防泄漏、隐私计算和数据治理 的高隔离要求，其 旧版事件吞吐 被定为 198400 events/s；叠加 v3.4、legacy 之后，可支撑 320000 events/s 的吞吐基线，覆盖 cn 区域。
- type: para
  text: 从运维视角看，数据防泄漏 在 v3.5-cn-finance 上的 旧版 P95 延迟 表现稳定为 51 ms，v3.4、legacy；这一口径与相邻产品 P008 的 数据防泄漏、隐私计算和数据治理 联合方案保持一致。
- type: para
  text: 数据防泄漏 的产品资料强调 与 P008 兼容；在默认配置下等于 true bool，约束为 edge P007->P008。当工作负载包含 脱敏、防泄漏、水印、敏感识别、DLP、外发审计、数据分类、边界 等能力维度时，上述约束保持不变。
- type: para
  text: Data Loss Prevention（COVDLP）的 与 P015 兼容 记为 true bool，限定条件 edge P007->P015；该数值服务于 数据防泄漏、隐私计算和数据治理，由 v3.5-cn-finance 版本正式支持。
- type: para
  text: 关于 数据防泄漏 的 核心协议，文献给出的标准口径为 DLP 正则库、敏感数据 OCR、水印追踪 ，并附加 支持 DLP 正则库、支持 敏感数据 OCR、支持 水印追踪 说明；这是评估 数据防泄漏、隐私计算和数据治理 能力时的重要依据（P007-F121）。
- type: para
  text: 数据防泄漏 v3.5-cn-finance 的 事件摄取吞吐 配置为 320000 events/s；在 enterprise-edition、3-node 场景下仍能维持 30 ms 的 P95 延迟，符合 cn 区域的运营要求。
- type: para
  text: 数据防泄漏（Data Loss Prevention，代号 COVDLP）隶属于数据防泄漏、隐私计算和数据治理场景，当前生命状态ACTIVE，当前版本线 v3.5。其 API 峰值并发 的取值/配置为 9000 req/s，约束条件包括enterprise-edition。
- type: para
  text: 在企业版部署中，数据防泄漏 将 P95 检索延迟 设计为 30 ms，并受到 p95、warm 的边界约束；相关细节记录的 fact_id 为 P007-F124，自 2026-01-01 起生效。
- type: para
  text: 数据防泄漏 面向 数据防泄漏、隐私计算和数据治理 的高隔离要求，其 最大单文档上传 被定为 64 MB；叠加 默认限制 之后，可支撑 320000 events/s 的吞吐基线，覆盖 cn 区域。
- type: para
  text: 从运维视角看，数据防泄漏 在 v3.5-cn-finance 上的 日志/审计留存期 表现稳定为 180 days，默认；这一口径与相邻产品 P008 的 数据防泄漏、隐私计算和数据治理 联合方案保持一致。
- type: para
  text: 数据防泄漏 的产品资料强调 批量接口吞吐；在默认配置下等于 7800 ops/s，约束为 batch=512。当工作负载包含 脱敏、防泄漏、水印、敏感识别、DLP、外发审计、数据分类、边界 等能力维度时，上述约束保持不变。
- type: para
  text: Data Loss Prevention（COVDLP）的 当前版本线 记为 v3.5 version，限定条件 GA；该数值服务于 数据防泄漏、隐私计算和数据治理，由 v3.5-cn-finance 版本正式支持。
- type: para
  text: 关于 数据防泄漏 的 默认批次大小，文献给出的标准口径为 512 items，并附加 可配置 说明；这是评估 数据防泄漏、隐私计算和数据治理 能力时的重要依据（P007-F129）。
- type: heading
  text: 否定事实与边界
- type: para
  text: 边界事实（must-not-claim）：仅企业版支持跨边界脱敏。
- type: para
  text: 边界事实：数据防泄漏 不支持 不支持主库直接内联扫描（详见 P007-F 系事实）。
- type: para
  text: 边界事实（must-not-claim）：不支持 S3 未挂载桶扫描。
- type: para
  text: 边界事实：数据防泄漏 不支持 不支持主库直接内联扫描（详见 P007-F 系事实）。
