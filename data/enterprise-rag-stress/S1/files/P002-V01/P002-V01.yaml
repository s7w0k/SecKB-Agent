  text: 模型溯源 的产品资料强调 与 P018 兼容；在默认配置下等于 true bool，约束为 edge P002->P018。当工作负载包含 SBOM、哈希、来源链、模型指纹、签名、供应链、版本追踪 等能力维度时，上述约束保持不变。
- type: para
  text: Model Provenance（MODSRC）的 与 P010 兼容 记为 true bool，限定条件 edge P002->P010；该数值服务于 LLM 网关与模型调用治理，由 v2.4-cn-intl 版本正式支持。
- type: para
  text: 关于 模型溯源 的 核心协议，文献给出的标准口径为 SBOM 扫描、OCI Registry 钩子 ，并附加 支持 SBOM 扫描、支持 OCI Registry 钩子 说明；这是评估 LLM 网关与模型调用治理 能力时的重要依据（P002-F021）。
- type: para
  text: 模型溯源 v2.4-cn-intl 的 事件摄取吞吐 配置为 62000 events/s；在 enterprise-edition、3-node 场景下仍能维持 38 ms 的 P95 延迟，符合 cn 区域的运营要求。
- type: para
  text: 模型溯源（Model Provenance，代号 MODSRC）隶属于LLM 网关与模型调用治理场景，当前生命状态ACTIVE，当前版本线 v2.4。其 API 峰值并发 的取值/配置为 2100 req/s，约束条件包括enterprise-edition。
- type: para
  text: 在企业版部署中，模型溯源 将 P95 检索延迟 设计为 38 ms，并受到 p95、warm 的边界约束；相关细节记录的 fact_id 为 P002-F024，自 2026-01-01 起生效。
- type: para
  text: 模型溯源 面向 LLM 网关与模型调用治理 的高隔离要求，其 最大单文档上传 被定为 8 MB；叠加 默认限制 之后，可支撑 62000 events/s 的吞吐基线，覆盖 cn 区域。
- type: para
  text: 从运维视角看，模型溯源 在 v2.4-cn-intl 上的 日志/审计留存期 表现稳定为 365 days，默认；这一口径与相邻产品 P018 的 LLM 网关与模型调用治理 联合方案保持一致。
- type: para
  text: 模型溯源 的产品资料强调 批量接口吞吐；在默认配置下等于 3400 ops/s，约束为 batch=128。当工作负载包含 SBOM、哈希、来源链、模型指纹、签名、供应链、版本追踪 等能力维度时，上述约束保持不变。
- type: para
  text: Model Provenance（MODSRC）的 当前版本线 记为 v2.4 version，限定条件 GA；该数值服务于 LLM 网关与模型调用治理，由 v2.4-cn-intl 版本正式支持。
- type: para
  text: 关于 模型溯源 的 默认批次大小，文献给出的标准口径为 128 items，并附加 可配置 说明；这是评估 LLM 网关与模型调用治理 能力时的重要依据（P002-F029）。
- type: heading
  text: 否定事实与边界
- type: para
  text: 边界事实（must-not-claim）：红队评估结果不自动写回溯源链。
- type: para
  text: 边界事实：模型溯源 不支持 不支持自定义 SBOM 字段校验器（详见 P002-F 系事实）。
- type: para
  text: 边界事实（must-not-claim）：社区版无法导出 DER 签名。
- type: para
  text: 边界事实：模型溯源 不支持 不支持自定义 SBOM 字段校验器（详见 P002-F 系事实）。
