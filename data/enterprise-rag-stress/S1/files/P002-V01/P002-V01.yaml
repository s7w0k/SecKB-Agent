doc_id: P002-V01
product: P002
version: v2.4
family: config-sample
items:
- type: heading
  text: 产品定位与场景 - 1
- type: para
  text: 模型溯源（Model Provenance，代号 MODSRC）隶属于LLM 网关与模型调用治理场景，当前生命状态ACTIVE，当前版本线 v2.4。其 核心协议 的取值/配置为 SBOM 扫描、OCI Registry 钩子 ，约束条件包括支持 SBOM 扫描、支持 OCI Registry 钩子。
- type: para
  text: 在企业版部署中，模型溯源 将 事件摄取吞吐 设计为 62000 events/s，并受到 enterprise-edition、3-node 的边界约束；相关细节记录的 fact_id 为 P002-F022，自 2025-06-01 起生效。
- type: para
  text: 模型溯源 面向 LLM 网关与模型调用治理 的高隔离要求，其 API 峰值并发 被定为 2100 req/s；叠加 enterprise-edition 之后，可支撑 62000 events/s 的吞吐基线，覆盖 cn 区域。
- type: para
  text: 从运维视角看，模型溯源 在 v2.4-cn-intl 上的 P95 检索延迟 表现稳定为 38 ms，p95、warm；这一口径与相邻产品 P018 的 LLM 网关与模型调用治理 联合方案保持一致。
- type: para
  text: 模型溯源 的产品资料强调 最大单文档上传；在默认配置下等于 8 MB，约束为 默认限制。当工作负载包含 SBOM、哈希、来源链、模型指纹、签名、供应链、版本追踪 等能力维度时，上述约束保持不变。
- type: para
  text: Model Provenance（MODSRC）的 日志/审计留存期 记为 365 days，限定条件 默认；该数值服务于 LLM 网关与模型调用治理，由 v2.4-cn-intl 版本正式支持。
- type: para
  text: 关于 模型溯源 的 批量接口吞吐，文献给出的标准口径为 3400 ops/s，并附加 batch=128 说明；这是评估 LLM 网关与模型调用治理 能力时的重要依据（P002-F027）。
- type: para
  text: 模型溯源 v2.4-cn-intl 的 当前版本线 配置为 v2.4 version；在 GA 场景下仍能维持 38 ms 的 P95 延迟，符合 cn 区域的运营要求。
- type: para
  text: 模型溯源（Model Provenance，代号 MODSRC）隶属于LLM 网关与模型调用治理场景，当前生命状态ACTIVE，当前版本线 v2.4。其 默认批次大小 的取值/配置为 128 items，约束条件包括可配置。
- type: para
  text: 在企业版部署中，模型溯源 将 不支持能力 设计为 不支持自定义 SBOM 字段校验器 ，并受到 negation 的边界约束；相关细节记录的 fact_id 为 P002-F030，自 2025-01-01 起生效。
- type: para
  text: 模型溯源 面向 LLM 网关与模型调用治理 的高隔离要求，其 否定事实 被定为 红队评估结果不自动写回溯源链 ；叠加 negation、must-not-claim 之后，可支撑 62000 events/s 的吞吐基线，覆盖 cn 区域。
- type: para
  text: 从运维视角看，模型溯源 在 v2.4-cn-intl 上的 否定事实 表现稳定为 社区版无法导出 DER 签名 ，negation、must-not-claim；这一口径与相邻产品 P018 的 LLM 网关与模型调用治理 联合方案保持一致。
- type: para
  text: 模型溯源 的产品资料强调 可用性目标；在默认配置下等于 99.9 percent，约束为 enterprise-SLA。当工作负载包含 SBOM、哈希、来源链、模型指纹、签名、供应链、版本追踪 等能力维度时，上述约束保持不变。
- type: para
  text: Model Provenance（MODSRC）的 合规基座 记为 GB-35273/CAC-审查-P002 ，限定条件 zh-cn；该数值服务于 LLM 网关与模型调用治理，由 v2.4-cn-intl 版本正式支持。
- type: para
  text: 关于 模型溯源 的 企业版起价，文献给出的标准口径为 20740 cny/月，并附加 per-org、annual 说明；这是评估 LLM 网关与模型调用治理 能力时的重要依据（P002-F035）。
- type: para
  text: 模型溯源 v2.4-cn-intl 的 主邻接产品 配置为 P018 product；在 邻接 P018 场景下仍能维持 38 ms 的 P95 延迟，符合 cn 区域的运营要求。
- type: para
  text: 模型溯源（Model Provenance，代号 MODSRC）隶属于LLM 网关与模型调用治理场景，当前生命状态ACTIVE，当前版本线 v2.4。其 旧版事件吞吐 的取值/配置为 38440 events/s，约束条件包括v2.3、legacy。
- type: para
  text: 在企业版部署中，模型溯源 将 旧版 P95 延迟 设计为 64 ms，并受到 v2.3、legacy 的边界约束；相关细节记录的 fact_id 为 P002-F038，自 2024-06-01 起生效。
- type: para
  text: 模型溯源 面向 LLM 网关与模型调用治理 的高隔离要求，其 与 P018 兼容 被定为 true bool；叠加 edge P002->P018 之后，可支撑 62000 events/s 的吞吐基线，覆盖 cn 区域。
- type: para
  text: 从运维视角看，模型溯源 在 v2.4-cn-intl 上的 与 P010 兼容 表现稳定为 true bool，edge P002->P010；这一口径与相邻产品 P018 的 LLM 网关与模型调用治理 联合方案保持一致。
