services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mindbridge
      MYSQL_USER: mindbridge
      MYSQL_PASSWORD: mindbridge
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.2-alpine
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true   # 本地评测：关闭安全插件，纯 HTTP
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "19200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment: &app-environment
      RUN_MODE: api
      AGENT_FRAMEWORK: ${AGENT_FRAMEWORK:-event_driven_multi_agent}
      MULTI_DOMAIN_ENABLED: ${MULTI_DOMAIN_ENABLED:-false}
      SERVICE_DOMAIN_ENABLED: ${SERVICE_DOMAIN_ENABLED:-false}
      COMPLIANCE_DOMAIN_ENABLED: ${COMPLIANCE_DOMAIN_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_BASE_URL: ${OPENAI_EMBEDDING_BASE_URL:-}
      OPENAI_EMBEDDING_API_KEY: ${OPENAI_EMBEDDING_API_KEY:-}
      EMBEDDING_PROVIDER_TYPE: ${EMBEDDING_PROVIDER_TYPE:-remote}
      ALLOW_DETERMINISTIC_EMBEDDING: "false"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mindbridge-qwen2.5-7b-ft:latest}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
      DATABASE_URL: mysql+pymysql://mindbridge:mindbridge@mysql:3306/mindbridge?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      VECTOR_BACKEND: opensearch
      OPENSEARCH_HOSTS: http://opensearch:9200
      OPENSEARCH_USE_SSL: "false"
      OPENSEARCH_VERIFY_CERTS: "false"
      OPENSEARCH_EMBEDDING_DIM: ${OPENSEARCH_EMBEDDING_DIM:-1024}
      OPENSEARCH_ALIAS_NAME: seckb-rag-current
      UNIFIED_INGEST_PIPELINE: "true"
      DOCUMENT_PROCESSING_V2_ENABLED: "true"
      DOCUMENT_PARSER_DEFAULT: mineru
      PDF_PARSER: mineru
      MINERU_BASE_URL: ${MINERU_BASE_URL:-https://mineru.net}
      MINERU_BACKEND: ${MINERU_BACKEND:-agent}
      PARSE_QUALITY_GATE_MODE: enforce
      EMBEDDING_INPUT_VERSION: v2
      KNOWLEDGE_VECTOR_ENABLED: ${KNOWLEDGE_VECTOR_ENABLED:-true}
      KNOWLEDGE_VECTOR_REQUIRED: ${KNOWLEDGE_VECTOR_REQUIRED:-false}
      CHROMA_PERSIST_DIR: /app/data/chroma
      CHROMA_SNAPSHOT_DIR: /app/data/chroma-snapshots
      CHROMA_COLLECTION_NAME: ${CHROMA_COLLECTION_NAME:-mindbridge_knowledge}
      TOOL_QUEUE_ENABLED: ${TOOL_QUEUE_ENABLED:-true}
      TOOL_QUEUE_EXCEL_WORKERS: ${TOOL_QUEUE_EXCEL_WORKERS:-1}
      TOOL_QUEUE_EMAIL_WORKERS: ${TOOL_QUEUE_EMAIL_WORKERS:-2}
      ALERT_EMAIL_DELIVERY_MODE: ${ALERT_EMAIL_DELIVERY_MODE:-log}
      ALERT_EMAIL_RATE_LIMIT_PER_MINUTE: ${ALERT_EMAIL_RATE_LIMIT_PER_MINUTE:-30}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_CAPTURE_INPUT: ${LANGFUSE_CAPTURE_INPUT:-false}
      LANGFUSE_CAPTURE_OUTPUT: ${LANGFUSE_CAPTURE_OUTPUT:-false}
      RAG_EVAL_LLM_ENABLED: ${RAG_EVAL_LLM_ENABLED:-false}
      RAG_EVAL_ONLINE_ENABLED: ${RAG_EVAL_ONLINE_ENABLED:-false}
      RAG_EVAL_ONLINE_SAMPLE_RATE: ${RAG_EVAL_ONLINE_SAMPLE_RATE:-0.05}
      RAG_EVAL_ONLINE_BUDGET_DAILY: ${RAG_EVAL_ONLINE_BUDGET_DAILY:-1000}
      RAG_EVAL_ONLINE_WINDOW_SECONDS: ${RAG_EVAL_ONLINE_WINDOW_SECONDS:-300}
      RAG_EVAL_ONLINE_STATE_DIR: ${RAG_EVAL_ONLINE_STATE_DIR:-target/rag-eval/online}
      RAG_EVAL_RUBRIC_VERSION: ${RAG_EVAL_RUBRIC_VERSION:-answer-v2}
      RAG_EVAL_GATE_MODE: ${RAG_EVAL_GATE_MODE:-observe}
      RAG_EVAL_JUDGE_MODEL: ${RAG_EVAL_JUDGE_MODEL:-qwen-plus}
      RAG_EVAL_JUDGE_BASE_URL: ${RAG_EVAL_JUDGE_BASE_URL:-}
      RAG_EVAL_JUDGE_API_KEY: ${RAG_EVAL_JUDGE_API_KEY:-}
      EXCEL_PATH: /app/data/mindbridge-risk-ledger.xlsx
    ports:
      - "8080:8080"
    volumes: &app-volumes
      - ./data:/app/data
      - ./app:/app/app:ro

  index-worker:
    build: .
    command: ["python", "-m", "app.workers.index_worker"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      <<: *app-environment
      RUN_MODE: index-worker
    volumes: *app-volumes

  # 先按 MinerU 官方 Dockerfile 构建本地 mineru:latest，再用 --profile mineru 启动。
  mineru:
    image: mineru:latest
    profiles: ["mineru"]
    restart: unless-stopped
    entrypoint: mineru-api
    command: ["--host", "0.0.0.0", "--port", "8000"]
    environment:
      MINERU_MODEL_SOURCE: local
    ports:
      - "18000:8000"
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
  redis-data:
  opensearch-data:
