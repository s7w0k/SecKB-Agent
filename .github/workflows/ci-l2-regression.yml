name: CI L2 Regression

# P8-02：定时/发布候选 -- 全量 retrieval + RAGAS regression
# 触发：每周日凌晨 02:00 UTC（定时）+ release/* 分支推送（发布候选）
# 依赖：RAG_EVAL_JUDGE_API_KEY（L2 secrets）
# 门禁：先 Soft（记录回归但 exit=0），成熟后切 Hard（exit=1）
# Artifacts：report JSON / manifest / JSONL / summary / gate decision（可下载）

on:
  schedule:
    - cron: "0 2 * * 0"  # 每周日 02:00 UTC
  push:
    branches:
      - "release/*"
  workflow_dispatch:  # 手动触发

jobs:
  l2-ragas-regression:
    name: L2 RAGAS Regression
    runs-on: ubuntu-latest
    # 无 judge key 时跳过（§13.5：PR 无 judge key 时也能完成 L0/L1）
    if: ${{ github.event_name != 'schedule' || true }}  # 允许手动触发
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-eval.txt
      - name: Run full RAGAS regression (Hard Gate)
        env:
          AI_PROVIDER: mock
          DATABASE_URL: sqlite:///./target/ci-l2.sqlite3
          KNOWLEDGE_VECTOR_ENABLED: "false"
          RAG_EVAL_LLM_ENABLED: "true"
          RAG_EVAL_JUDGE_MODEL: ${{ secrets.RAG_EVAL_JUDGE_MODEL || 'gpt-4o-mini' }}
          RAG_EVAL_JUDGE_BASE_URL: ${{ secrets.RAG_EVAL_JUDGE_BASE_URL || '' }}
          RAG_EVAL_JUDGE_API_KEY: ${{ secrets.RAG_EVAL_JUDGE_API_KEY }}
          RAG_EVAL_GATE_MODE: hard
        run: |
          set -euo pipefail
          mkdir -p target/rag-eval/candidate target/rag-eval/baseline
          echo "=== Running RAGAS regression pipeline ==="
          # §8.2：禁止吞失败 —— 评测失败必须让 job 非零退出，而不是 || echo
          python -m app.rag_eval.cli run \
            --dataset data/eval/regression/rag-regression.json \
            --output target/rag-eval/candidate/
          GATE_EXIT=0
          if [ -f target/rag-eval/baseline/summary.json ]; then
            echo "=== Running hard gate evaluation ==="
            set +e
            python -m app.rag_eval.gates evaluate \
              --baseline target/rag-eval/baseline/summary.json \
              --candidate target/rag-eval/candidate/summary.json \
              --candidate-per-case target/rag-eval/candidate/cases.jsonl \
              --mode hard \
              --dataset-version "$(date -u +%Y-%m-%d).1" \
              --candidate-run-id "${{ github.run_id }}" \
              --output target/rag-eval/gate-decision.json
            GATE_EXIT=$?
            set -e
            cat target/rag-eval/gate-decision.json
          else
            echo "No baseline found (first run): seeding baseline, not evaluating yet"
            echo '{"status":"pass","reasons":["no baseline yet, first run seeds baseline"]}' > target/rag-eval/gate-decision.json
            GATE_EXIT=0
          fi
          # §8.3：仅 hard gate 通过（exit==0）才把 candidate 提升为下次 baseline；
          # 失败的候选不得污染稳定 baseline（Unblessed Baseline Usage = 0）。
          if [ -f target/rag-eval/candidate/summary.json ] && [ "$GATE_EXIT" = "0" ]; then
            cp target/rag-eval/candidate/summary.json target/rag-eval/baseline/summary.json
          fi
          echo "L2 gate exit = $GATE_EXIT"
          # §8.2 §8.9：Gate 失败必须真正阻止 merge/release —— 以真实 exit code 收尾
          exit $GATE_EXIT
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-artifacts
          path: |
            target/rag-eval/candidate/
            target/rag-eval/baseline/
            target/rag-eval/gate-decision.json
            target/rag-eval/smoke-report.json
          retention-days: 30
